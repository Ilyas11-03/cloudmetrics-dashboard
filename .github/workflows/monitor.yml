name: CloudMetrics Background Worker

on:
  schedule:
    # Exécuter toutes les 5 minutes (format cron)
    - cron: '*/5 * * * *'
  # Permet aussi de le lancer manuellement depuis l'onglet "Actions" de GitHub
  workflow_dispatch:

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Metrics Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/seed-metrics.ts